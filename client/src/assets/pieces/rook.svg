<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%">

  <defs>
    <radialGradient id="spotlightGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C6A15B" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#C6A15B" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="floorShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#000000" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="30%" stop-color="#C6A15B"/>
      <stop offset="70%" stop-color="#8C6D2D"/>
      <stop offset="100%" stop-color="#DFB86C"/>
    </linearGradient>
    <linearGradient id="darkMetalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A3A3D"/>
      <stop offset="35%" stop-color="#222225"/>
      <stop offset="65%" stop-color="#18181A"/>
      <stop offset="100%" stop-color="#2C2C30"/>
    </linearGradient>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1C1C1E"/>
      <stop offset="25%" stop-color="#48484E"/>
      <stop offset="50%" stop-color="#D1D1D6"/>
      <stop offset="75%" stop-color="#323236"/>
      <stop offset="100%" stop-color="#141416"/>
    </linearGradient>
    <filter id="dropGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
  </defs>

  <circle cx="200" cy="280" r="180" fill="url(#spotlightGlow)" />
  <ellipse cx="200" cy="560" rx="140" ry="24" fill="url(#floorShadow)" />
  
  <g filter="url(#dropGlow)">
    <!-- Base -->
    <path d="M105 540 C105 520 125 515 145 510 L255 510 C275 515 295 520 295 540 C295 552 275 558 200 558 C125 558 105 552 105 540 Z" fill="url(#silverGrad)" />
    <path d="M115 525 L285 525 L275 510 L125 510 Z" fill="url(#goldGrad)" />
    <path d="M130 510 L270 510 L255 470 L145 470 Z" fill="url(#darkMetalGrad)" stroke="#C6A15B" stroke-width="1" />
    
    <!-- Tower Body (fluted fortress walls) -->
    <path d="M145 470 L160 250 L240 250 L255 470 Z" fill="url(#silverGrad)" />
    <!-- Masonry Grooves -->
    <line x1="165" y1="320" x2="235" y2="320" stroke="#C6A15B" stroke-width="1" stroke-opacity="0.6" />
    <line x1="160" y1="390" x2="240" y2="390" stroke="#C6A15B" stroke-width="1" stroke-opacity="0.6" />
    
    <!-- Upper Cornice -->
    <path d="M145 250 L255 250 L265 220 L135 220 Z" fill="url(#goldGrad)" stroke="#FFE082" stroke-width="1" />
    <rect x="130" y="210" width="140" height="15" fill="url(#darkMetalGrad)" stroke="#C6A15B" stroke-width="1" />
    
    <!-- Crenels / Battlements -->
    <!-- Left turret -->
    <rect x="130" y="150" width="28" height="60" fill="url(#silverGrad)" stroke="#C6A15B" stroke-width="1" />
    <!-- Center left turret -->
    <rect x="168" y="150" width="28" height="60" fill="url(#silverGrad)" stroke="#C6A15B" stroke-width="1" />
    <!-- Center right turret -->
    <rect x="204" y="150" width="28" height="60" fill="url(#silverGrad)" stroke="#C6A15B" stroke-width="1" />
    <!-- Right turret -->
    <rect x="242" y="150" width="28" height="60" fill="url(#silverGrad)" stroke="#C6A15B" stroke-width="1" />
    
    <!-- Gold Trim Cap -->
    <rect x="128" y="146" width="32" height="6" fill="url(#goldGrad)" />
    <rect x="166" y="146" width="32" height="6" fill="url(#goldGrad)" />
    <rect x="202" y="146" width="32" height="6" fill="url(#goldGrad)" />
    <rect x="240" y="146" width="32" height="6" fill="url(#goldGrad)" />
  </g>
</svg>
