<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%">

  <defs>
    <radialGradient id="spotlightGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C6A15B" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#C6A15B" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="floorShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#000000" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="30%" stop-color="#C6A15B"/>
      <stop offset="70%" stop-color="#8C6D2D"/>
      <stop offset="100%" stop-color="#DFB86C"/>
    </linearGradient>
    <linearGradient id="darkMetalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A3A3D"/>
      <stop offset="35%" stop-color="#222225"/>
      <stop offset="65%" stop-color="#18181A"/>
      <stop offset="100%" stop-color="#2C2C30"/>
    </linearGradient>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1C1C1E"/>
      <stop offset="25%" stop-color="#48484E"/>
      <stop offset="50%" stop-color="#D1D1D6"/>
      <stop offset="75%" stop-color="#323236"/>
      <stop offset="100%" stop-color="#141416"/>
    </linearGradient>
    <filter id="dropGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
  </defs>

  <circle cx="200" cy="280" r="180" fill="url(#spotlightGlow)" />
  <ellipse cx="200" cy="560" rx="140" ry="24" fill="url(#floorShadow)" />
  
  <g filter="url(#dropGlow)">
    <!-- Base -->
    <path d="M110 540 C110 520 130 515 150 510 L250 510 C270 515 290 520 290 540 C290 552 270 558 200 558 C130 558 110 552 110 540 Z" fill="url(#silverGrad)" />
    <path d="M120 525 L280 525 L270 510 L130 510 Z" fill="url(#goldGrad)" />
    <path d="M135 510 L265 510 L255 480 L145 480 Z" fill="url(#darkMetalGrad)" stroke="#C6A15B" stroke-width="1" />
    
    <!-- Body -->
    <path d="M145 480 C158 420 165 365 168 310 L232 310 C235 365 242 420 255 480 Z" fill="url(#silverGrad)" />
    
    <!-- Gold Collars -->
    <rect x="158" y="300" width="84" height="14" rx="6" fill="url(#goldGrad)" />
    <rect x="152" y="282" width="96" height="18" rx="7" fill="url(#darkMetalGrad)" stroke="#C6A15B" stroke-width="1" />
    
    <!-- Mitre Head -->
    <path d="M155 282 C145 220 150 160 200 120 C250 160 255 220 245 282 Z" fill="url(#silverGrad)" stroke="#C6A15B" stroke-width="1.5" />
    
    <!-- Mitre Cut / Slash -->
    <path d="M185 140 L215 180 L205 195 L175 155 Z" fill="#0F0F10" stroke="#C6A15B" stroke-width="1.5" />
    
    <!-- Top Finial Ball -->
    <circle cx="200" cy="112" r="12" fill="url(#goldGrad)" stroke="#FFE082" stroke-width="1" />
    <circle cx="198" cy="108" r="3" fill="#FFF" />
  </g>
</svg>
